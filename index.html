<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Day Planner – Visual Schedule &amp; Task System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <a class="skip" href="#app">Skip to main content</a>
  <header id="top"></header>
  <main id="app" tabindex="-1"></main>

  <!-- Screen-reader announcements and visible toasts -->
  <div id="live" class="visually-hidden" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Celebration overlay (child view) -->
  <div id="celebrate" role="dialog" aria-modal="true" aria-labelledby="celTitle" hidden></div>

  <!-- Generic form modal -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <form class="modal-content" id="formEl">
        <div class="modal-header">
          <h2 class="modal-title h4" id="formTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="formBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-main" id="formOk">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Accessible confirmation dialog -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-describedby="confirmMsg" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h4" id="confirmTitle">Please confirm</h2></div>
        <div class="modal-body" id="confirmMsg"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmOk">Yes, continue</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
